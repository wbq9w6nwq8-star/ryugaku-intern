<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情報交換ボード | RyugakuIntern</title>
  <link rel="icon" type="image/png" href="favicon.png?v=99">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon.png?v=99">
  <link rel="shortcut icon" href="favicon.png?v=99">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9644749026345882" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
 <link rel="stylesheet" href="custom.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen antialiased flex flex-col">
  <div id="common-header"></div>

  <main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-[10px] font-extrabold uppercase bg-indigo-600 text-white px-2 py-0.5 rounded">Anonymous Thread Board</span>
          <span class="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-0.5 rounded-full">日替わりID・アンカー(&gt;&gt;1)・sage対応</span>
        </div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 mt-1.5">💬 海外大生 匿名情報交換ボード</h1>
      </div>
      <button onclick="document.getElementById('new-thread-box').classList.toggle('hidden')" class="self-start sm:self-auto bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl shadow-xs cursor-pointer">
        ✏️ 新規スレッドを立てる
      </button>
    </div>

    <!-- 新規スレ立てフォーム -->
    <div id="new-thread-box" class="hidden bg-white p-5 rounded-2xl border border-indigo-200 shadow-sm mb-6">
      <h2 class="text-sm font-extrabold text-slate-900 mb-3">新規スレッド作成</h2>
      <form onsubmit="submitNewThread(event)" class="space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <input type="text" id="new-author" placeholder="名前（省略可：名無しの海外大生）" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
          <input type="text" id="new-uni" placeholder="留学先・学年（任意：UK 2年など）" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
          <select id="new-tag" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold">
            <option value="💼 ボスキャリ・就活">💼 ボスキャリ・就活</option>
            <option value="☀️ 夏休み・帰国">☀️ 夏休み・帰国</option>
            <option value="💻 リモート・バイト">💻 リモート・バイト</option>
            <option value="🌍 留学生活・悩み">🌍 留学生活・悩み</option>
          </select>
        </div>
        <input type="text" id="new-title" placeholder="スレッドタイトル（例：【27卒】ボスキャリ選考状況・ES通過スレ）" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm font-bold">
        <textarea id="new-body" rows="3" placeholder=">>1 の本文を書いてください" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm"></textarea>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="document.getElementById('new-thread-box').classList.add('hidden')" class="px-4 py-2 text-xs font-bold text-slate-500 cursor-pointer">閉じる</button>
          <button type="submit" id="new-thread-btn" class="bg-indigo-600 text-white text-xs font-bold px-5 py-2 rounded-xl cursor-pointer">新規スレッドを作成する</button>
        </div>
      </form>
    </div>

    <!-- 板カテゴリタブ -->
    <div class="flex flex-wrap gap-1.5 mb-5">
      <button onclick="setBoardCat('all', this)" class="board-cat-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white cursor-pointer">すべて</button>
      <button onclick="setBoardCat('💼 ボスキャリ・就活', this)" class="board-cat-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 cursor-pointer">💼 ボスキャリ・就活</button>
      <button onclick="setBoardCat('☀️ 夏休み・帰国', this)" class="board-cat-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 cursor-pointer">☀️ 夏休み・帰国</button>
      <button onclick="setBoardCat('💻 リモート・バイト', this)" class="board-cat-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 cursor-pointer">💻 リモート・バイト</button>
      <button onclick="setBoardCat('🌍 留学生活・悩み', this)" class="board-cat-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 cursor-pointer">🌍 留学生活・悩み</button>
    </div>

    <!-- スレッド一覧 / 詳細描画エリア -->
    <div id="board-root">
      <div class="text-center py-10 text-xs text-slate-400">スレッドを読み込み中...</div>
    </div>
  </main>

  <div id="common-footer"></div>

  <script src="common.js"></script>
  <script src="board.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', fetchThreads);
  </script>
</body>
</html>
