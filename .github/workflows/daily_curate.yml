name: Daily AI Job News Curation

on:
  schedule:
    - cron: '0 5,13,21 * * *'
  workflow_dispatch:

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy

      - name: Run AI News Curator & Auto Post to X
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/curate_news.py

      - name: Commit and push updated news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "RyugakuIntern AI Bot"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update curated job news" && git pull --rebase && git push)
