name: Daily AI Job News Curation

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AI News Curator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/curate_news.py

      - name: Commit and push updated news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "RyugakuIntern AI Bot"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update curated job news" && git push --force)
