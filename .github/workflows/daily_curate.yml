name: Daily AI Job News Curation

on:
  schedule:
    # 毎日 日本時間 06:00（UTC 21:00）に自動実行
    - cron: '0 21 * * *'
  # GitHub画面から手動で「今すぐ実行」テストもできるボタンを有効化
  workflow_dispatch:

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AI News Curator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/curate_news.py

      - name: Commit and push updated news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "RyugakuIntern AI Bot"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update curated job news" && git push)
