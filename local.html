<!DOCTYPE html>
 <!-- ファビコン・アイコン設定 -->
  <link rel="icon" type="image/png" href="favicon.png?v=99">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon.png?v=99">
  <link rel="shortcut icon" href="favicon.png?v=99">
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ローカル生活情報・ニュース | World Life Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <!-- シンプルなヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="font-extrabold text-sm text-indigo-600 hover:underline">← ホーム（チャット＆時計）へ戻る</a>
      <span class="text-xs font-bold text-slate-500">Global Life & Local News</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <!-- 同じ天気＆都市切り替えバーを表示（ここで変更するとindex.html側とも連動します） -->
    <div id="local-life-widget"></div>

    <!-- ニュース一覧セクション -->
    <div class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-xs">
      <div class="mb-5 pb-3 border-b border-slate-100">
        <h1 id="news-city-title" class="font-extrabold text-base sm:text-lg text-slate-900">現地ニュース・生活情報</h1>
        <p class="text-xs text-slate-500 mt-1">選択中の都市に合わせて、現地の最新トピックを自動収集しています（ワーホリ・駐在・留学・永住者向け）</p>
      </div>

      <div id="local-news-feed" class="space-y-3"></div>
    </div>
  </main>

  <script src="local-hub.js"></script>
</body>
</html>
